# Plain HTTP for the windle names: ACME HTTP-01 first, everything else 301 to HTTPS.
# Apex goes straight to https://www (one hop instead of two). With Cloudflare "Always Use HTTPS" on,
# visitors never reach this; it serves certbot and anyone hitting the origin directly.
#
# Cloudflare SSL mode MUST be Full (strict): in Flexible mode Cloudflare talks to us over :80 and this
# redirect would loop forever.
server {
    listen 80;
    listen [::]:80;
    server_name windle.fun www.windle.fun app.windle.fun api.windle.fun cdn.windle.fun docs.windle.fun oauth.windle.fun;

    access_log /var/log/nginx/windle-http.access.log windle_json;

    include /etc/nginx/snippets/windle-acme.conf;

    location / {
        return 301 https://$windle_canonical_host$request_uri;
    }
}
