# oauth.windle.fun - sign-in / registration SPA (apps/auth). Same SPA rules as app.
# Logged WITHOUT query strings: return_to and future OAuth callbacks carry codes in the URL.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oauth.windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-security.conf;
    include /etc/nginx/snippets/windle-csp-oauth.conf;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cache-Control $windle_cc;
    add_header X-Robots-Tag "noindex" always;
    include /etc/nginx/snippets/windle-compression.conf;

    access_log /var/log/nginx/windle-oauth.access.log windle_json_noquery;
    error_log  /var/log/nginx/windle-oauth.error.log warn;

    root /opt/windle/current/auth;
    set $windle_cc "no-cache";

    include /etc/nginx/snippets/windle-static-common.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
