# www.windle.fun - landing (apps/web). Static single page with clean chapter paths (/promise ... /launch, no hashes):
# each path serves its own pre-rendered HTML (dist/<chapter>.html: own title/description/canonical/OG/JSON-LD,
# written by apps/web/scripts/seo-pages.ts); / serves index.html; unknown paths are a real 404.
# Keep the list in sync with CHAPTER_PATHS in apps/web/src/features/story/routes.ts and
# CHAPTER_SEO in apps/web/scripts/chapter-seo.ts.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-security.conf;
    include /etc/nginx/snippets/windle-csp-www.conf;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cache-Control $windle_cc;
    include /etc/nginx/snippets/windle-compression.conf;

    access_log /var/log/nginx/windle-www.access.log windle_json;
    error_log  /var/log/nginx/windle-www.error.log warn;

    root /opt/windle/current/web;
    set $windle_cc "no-cache";

    include /etc/nginx/snippets/windle-static-common.conf;

    error_page 404 /404.html;
    location = /404.html { internal; set $windle_cc "no-store"; }

    # Chapter paths of the story SPA. Trailing slash -> 301 to the canonical no-slash form (query kept).
    location ~ ^/(promise|collateral|market|incentive|judge|outcome|ecosystem|launch)/$ {
        return 301 /$1$is_args$args;
    }
    # The file form is not a second URL for the same page: /market.html -> /market.
    location ~ ^/(promise|collateral|market|incentive|judge|outcome|ecosystem|launch)\.html$ {
        return 301 /$1$is_args$args;
    }
    # No-slash form: the chapter's own HTML with 200 and the document cache policy (no-cache: the shell must
    # revalidate so a deploy is picked up; hashed /assets/ stay immutable via windle-static-common.conf).
    # try_files serves the file inside this location, so the .html redirect above is never hit internally.
    location ~ ^/(promise|collateral|market|incentive|judge|outcome|ecosystem|launch)$ {
        set $windle_cc "no-cache";
        try_files /$1.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
