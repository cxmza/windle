# docs.windle.fun - documentation (apps/docs, Astro Starlight). Static with clean URLs:
# /guide -> /guide/index.html or /guide.html. Astro's hashed assets (/_astro/) are immutable.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-security.conf;
    include /etc/nginx/snippets/windle-csp-docs.conf;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cache-Control $windle_cc;
    include /etc/nginx/snippets/windle-compression.conf;

    access_log /var/log/nginx/windle-docs.access.log windle_json;
    error_log  /var/log/nginx/windle-docs.error.log warn;

    root /opt/windle/current/docs;
    set $windle_cc "no-cache";

    include /etc/nginx/snippets/windle-static-common.conf;

    # Pagefind index: content-addressed fragments, but entry files keep their names -> short cache.
    location ^~ /pagefind/ {
        set $windle_cc "public, max-age=300";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; set $windle_cc "no-store"; }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
