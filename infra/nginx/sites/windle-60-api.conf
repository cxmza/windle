# api.windle.fun - reverse proxy to the Fastify backend on 127.0.0.1:3001 (compose service `api`).
#
# Ownership of headers: nginx = HSTS/nosniff/XFO/Referrer/COOP (app copies are hidden, see
# windle-proxy-api.conf); app = CSP (its /reference UI needs its own) and CORS. Never add CORS here:
# nginx + app both sending Access-Control-* produces duplicates or the forbidden
# Allow-Origin:* + Allow-Credentials pair ("works in curl, fails in the browser").
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-security.conf;
    add_header X-Robots-Tag "noindex" always;

    access_log /var/log/nginx/windle-api.access.log windle_json;
    error_log  /var/log/nginx/windle-api.error.log warn;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # nginx-generated failures become JSON, in the same envelope the api uses.
    # 502/504 (backend down / not deployed yet / too slow) are answered as 503 + Retry-After: the request
    # is fine, the service is temporarily unavailable. Errors returned BY the app pass through untouched
    # (proxy_intercept_errors stays off).
    error_page 502 503 504 = @api_unavailable;
    error_page 429 = @api_rate_limited;
    error_page 413 = @api_too_large;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Prometheus metrics are for the host only (the app also guards them); never reachable through the edge.
    location = /metrics {
        default_type application/json;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/windle-security.conf;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":{"code":"not_found","message":"Not found."}}
';
    }

    # Sign-in endpoints (nonce, verify, logout, provider starts): brute-force/nonce-spam guard, per real client IP.
    location ^~ /v1/auth/ {
        limit_req zone=windle_auth burst=10 nodelay;
        include /etc/nginx/snippets/windle-proxy-api.conf;
    }

    # Read-only auth state: every app page load asks for the session, so these use the general zone.
    location = /v1/auth/session {
        limit_req zone=windle_api burst=40 nodelay;
        include /etc/nginx/snippets/windle-proxy-api.conf;
    }
    location = /v1/auth/providers {
        limit_req zone=windle_api burst=40 nodelay;
        include /etc/nginx/snippets/windle-proxy-api.conf;
    }

    # API reference UI (scalar bundle is ~4.4 MB raw) and the OpenAPI document: compressed on the fly.
    # Deliberately NOT for the rest of the api: compressing responses that mix secrets with reflected input
    # is the BREACH pattern, and api JSON is small anyway.
    location ^~ /reference {
        limit_req zone=windle_api burst=40 nodelay;
        include /etc/nginx/snippets/windle-proxy-api.conf;
        include /etc/nginx/snippets/windle-compression-proxied.conf;
    }
    location = /openapi.json {
        limit_req zone=windle_api burst=40 nodelay;
        include /etc/nginx/snippets/windle-proxy-api.conf;
        include /etc/nginx/snippets/windle-compression-proxied.conf;
    }

    location / {
        limit_req zone=windle_api burst=40 nodelay;
        include /etc/nginx/snippets/windle-proxy-api.conf;
    }

    # Named locations declare their own add_header, so server-level headers are re-added explicitly.
    location @api_unavailable {
        include /etc/nginx/snippets/windle-security.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"The windle API is not reachable right now. Please retry shortly."}}\n';
    }

    location @api_rate_limited {
        include /etc/nginx/snippets/windle-security.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Retry-After "5" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Slow down and retry."}}\n';
    }

    location @api_too_large {
        include /etc/nginx/snippets/windle-security.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds 1 MB."}}\n';
    }
}
