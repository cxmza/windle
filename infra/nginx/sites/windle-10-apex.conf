# windle.fun -> https://www.windle.fun (permanent; www is canonical).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-security.conf;
    access_log /var/log/nginx/windle-apex.access.log windle_json;

    return 301 https://www.windle.fun$request_uri;
}
