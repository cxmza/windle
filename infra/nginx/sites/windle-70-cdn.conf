# cdn.windle.fun - public assets, brand kit and on-the-fly image transforms.
#
#   /assets/, /fonts/   content-hashed / versioned files -> 1 year, immutable
#   /brand/             brand kit (stable names)         -> 1 day + stale-while-revalidate
#   /img/<sig>/<opts>/plain/<path>[@fmt]                 -> imgproxy (signed URLs only), nginx disk cache
#   /                   landing page explaining the CDN
#
# Everything is CORS-readable (Access-Control-Allow-Origin: *): fonts and WebGL textures require it, and
# nothing here is private or credentialed.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-cdn-headers.conf;
    add_header Cache-Control $windle_cc;
    include /etc/nginx/snippets/windle-compression.conf;

    access_log /var/log/nginx/windle-cdn.access.log windle_json;
    error_log  /var/log/nginx/windle-cdn.error.log warn;

    root /opt/windle/current/cdn;
    index index.html;
    absolute_redirect off;
    etag on;
    client_max_body_size 1k;
    charset utf-8;
    set $windle_cc "public, max-age=3600";

    # Read-only host: GET/HEAD are served, OPTIONS answers CORS preflight, everything else is refused.
    if ($request_method = OPTIONS) {
        return 204;
    }
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        set $windle_cc "no-store";
        return 200 "ok\n";
    }

    location = / {
        set $windle_cc "public, max-age=300";
        try_files /index.html =404;
    }
    location = /index.html {
        set $windle_cc "public, max-age=300";
    }

    location ^~ /assets/ {
        set $windle_cc "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        set $windle_cc "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Landing icons and its Open Graph image: stable names, a day / a week.
    location ~ ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.png)$ {
        set $windle_cc "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    location = /og.png {
        set $windle_cc "public, max-age=604800";
        try_files $uri =404;
    }
    location ^~ /brand/ {
        set $windle_cc "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Image transforms. imgproxy runs with IMGPROXY_PATH_PREFIX=/img, so the URI is passed unchanged.
    # Cache key = negotiated format bucket + exact request URI (signature included).
    location ^~ /img/ {
        limit_req zone=windle_img_rl burst=60 nodelay;

        proxy_pass http://windle_imgproxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Accept $windle_img_accept;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        proxy_cache windle_img;
        proxy_cache_key "$windle_img_format|$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # We vary on the bucket via the key; upstream's Vary: Accept would make nginx compare raw Accept
        # strings and miss constantly.
        proxy_ignore_headers Vary Set-Cookie;
        proxy_hide_header Vary;
        proxy_hide_header Set-Cookie;

        include /etc/nginx/snippets/windle-cdn-headers.conf;
        add_header Vary "Accept" always;
        add_header X-Cache-Status $upstream_cache_status always;
        # Cloudflare must not cache auto-format responses (it ignores Vary: Accept). Empty = omitted.
        add_header Cloudflare-CDN-Cache-Control $windle_img_cf_cache always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
