# Unknown hosts. The origin IP is public; anything that is not one of our names is dropped, not served.
#  :80  -> 444 (close the connection without a response)
#  :443 -> TLS handshake rejected (ssl_reject_handshake, nginx >= 1.19.4): no certificate is shown to
#          scanners probing by IP or by a foreign SNI, so they cannot learn which names live here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}
