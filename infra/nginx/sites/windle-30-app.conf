# app.windle.fun - product SPA (apps/app). Client-side routing: unknown paths -> index.html.
# index.html is no-cache so a deploy is picked up immediately; /assets/* is immutable (hashed names).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.windle.fun;

    include /etc/nginx/snippets/windle-tls.conf;
    include /etc/nginx/snippets/windle-security.conf;
    include /etc/nginx/snippets/windle-csp-app.conf;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cache-Control $windle_cc;
    # Private product surface: never in search results (also <meta name="robots"> in apps/app/index.html).
    # Not blocked in robots.txt on purpose: a crawler must be able to fetch a page to see its noindex.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/windle-compression.conf;

    access_log /var/log/nginx/windle-app.access.log windle_json;
    error_log  /var/log/nginx/windle-app.error.log warn;

    root /opt/windle/current/app;
    set $windle_cc "no-cache";

    include /etc/nginx/snippets/windle-static-common.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
