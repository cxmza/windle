# windle: http-level pieces shared by all windle server blocks.
# Installed to /etc/nginx/conf.d/windle-http.conf (nginx.conf includes conf.d/*.conf inside http {}).
# Real client IP from Cloudflare is set globally by /etc/nginx/snippets/cloudflare-realip.conf, so
# $remote_addr below is the visitor, not a Cloudflare edge.

# --- access logs: one JSON object per line ---------------------------------------------------------
log_format windle_json escape=json
    '{"ts":"$time_iso8601","host":"$host","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"urt":"$upstream_response_time","ucs":"$upstream_status","cache":"$upstream_cache_status",'
    '"ref":"$http_referer","ua":"$http_user_agent","proto":"$server_protocol","tls":"$ssl_protocol",'
    '"cf_ray":"$http_cf_ray","cf_country":"$http_cf_ipcountry","rid":"$request_id"}';

# Same without the query string: for hosts whose URLs can carry one-time codes (oauth callbacks).
log_format windle_json_noquery escape=json
    '{"ts":"$time_iso8601","host":"$host","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"ref":"$http_referer","ua":"$http_user_agent","proto":"$server_protocol","tls":"$ssl_protocol",'
    '"cf_ray":"$http_cf_ray","cf_country":"$http_cf_ipcountry","rid":"$request_id"}';

# --- canonical host for the port-80 redirect (apex goes straight to www) ---------------------------
map $host $windle_canonical_host {
    windle.fun  www.windle.fun;
    default     $host;
}

# --- websockets: Upgrade passes through; plain requests keep the upstream keepalive -----------------
map $http_upgrade $windle_connection_upgrade {
    default upgrade;
    ""      "";
}

# --- image transforms: negotiate the format once, here -----------------------------------------------
# imgproxy picks AVIF/WebP from Accept when the URL has no explicit extension. Browsers send dozens of
# different Accept strings; caching on the raw header would shatter the cache. So: classify Accept into
# three buckets, send imgproxy a canonical Accept for the bucket, and key the nginx cache by the bucket.
map $http_accept $windle_img_format {
    ~*image/avif  avif;
    ~*image/webp  webp;
    default       legacy;
}
map $windle_img_format $windle_img_accept {
    avif     "image/avif,image/webp,image/*,*/*;q=0.8";
    webp     "image/webp,image/*,*/*;q=0.8";
    default  "image/*,*/*;q=0.8";
}
# Cloudflare (non-Enterprise) ignores Vary: Accept, so it would serve the first variant it cached
# (say AVIF) to every browser. Auto-format URLs therefore must not be cached by Cloudflare; URLs that pin
# the format (`@webp` suffix or an f:/format:/ext: option) are identical for everyone and may be.
# Empty value = header omitted.
map $request_uri $windle_img_cf_cache {
    "~(@[a-z0-9]+|/(f|format|ext):[a-z0-9]+(/[^?]*)?)(\?.*)?$"  "";
    default                                                    "no-store";
}

# --- cache for transformed images (bounded on disk) --------------------------------------------------
proxy_cache_path /var/cache/nginx/windle-img levels=1:2 keys_zone=windle_img:20m
                 max_size=2g inactive=30d use_temp_path=off;

# --- rate limits ------------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=windle_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=windle_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=windle_img_rl:10m rate=20r/s;
# Image uploads (POST api.windle.fun/v1/media): bodies up to 10 MB; the api adds per-user minute/day quotas.
limit_req_zone $binary_remote_addr zone=windle_upload:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;
# Concurrent long-lived connections (SSE) per client IP; the api caps them again (X_FEED_MAX_STREAMS_PER_IP).
limit_conn_zone $binary_remote_addr zone=windle_sse:10m;
limit_conn_status 429;
limit_conn_log_level warn;

# --- upstreams (all on loopback) ------------------------------------------------------------------
upstream windle_api {
    server 127.0.0.1:3001 max_fails=0;
    keepalive 16;
}
upstream windle_imgproxy {
    server 127.0.0.1:8081 max_fails=0;
    keepalive 16;
}
