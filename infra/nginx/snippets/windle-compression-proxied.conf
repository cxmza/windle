# On-the-fly compression for selected proxied api responses (api.windle.fun /reference, /openapi.json).
# gzip_proxied any: Cloudflare's requests carry Via-like proxy headers; compress them anyway.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json;

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/javascript application/javascript application/json;
