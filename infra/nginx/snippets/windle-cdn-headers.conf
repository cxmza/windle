# Headers for every cdn.windle.fun response. Re-included in each cdn location that declares add_header.
include /etc/nginx/snippets/windle-security.conf;
include /etc/nginx/snippets/windle-csp-cdn.conf;
# Public, credential-less assets: any origin may read them (fonts, and images used as WebGL textures,
# both require CORS). Never combined with Allow-Credentials.
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Max-Age "86400" always;
add_header Access-Control-Expose-Headers "Content-Length, ETag, X-Cache-Status" always;
add_header Timing-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
