# windle security headers. Included at SERVER level in every windle site.
#
# nginx gotcha: add_header is inherited by a location ONLY if that location declares no add_header of its
# own. Locations that need their own header (cdn /img/, api error pages) re-include this file. Anything
# that varies per location (Cache-Control) is passed through a variable instead ($windle_cc) so most
# locations never declare add_header and inheritance keeps working.
#
# Per-site pieces live elsewhere: CSP in windle-csp-<site>.conf, Cross-Origin-Resource-Policy in the site
# (cdn must be cross-origin, everything else same-site).

# HSTS without includeSubDomains/preload on purpose: preload is a one-way door (months to get out of
# browser lists) and includeSubDomains would force HTTPS on every future *.windle.fun, including names that
# may live elsewhere. Revisit once every subdomain is permanently HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Our windows do not share a browsing context group with foreign openers. Wallet Standard wallets inject
# into the page and are unaffected; a future OAuth provider must use redirect flow, not a popup.
add_header Cross-Origin-Opener-Policy "same-origin" always;
