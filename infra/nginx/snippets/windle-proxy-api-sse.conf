# Proxy settings for Server-Sent Events on api.windle.fun (GET /v1/x/stream).
# Unbuffered so every event reaches the browser at once (the api also sends X-Accel-Buffering: no), no cache, and
# a read timeout well above the api's 15 s `: ping` so an idle-but-healthy stream is never cut by nginx.
# Cloudflare drops a proxied connection after 100 s without bytes; the 15 s pings keep it open too.
include /etc/nginx/snippets/windle-proxy-api-upstream.conf;

proxy_connect_timeout 3s;
proxy_send_timeout 35s;
proxy_read_timeout 120s;

proxy_buffering off;
proxy_cache off;
proxy_request_buffering on;
