# CSP for docs.windle.fun (Astro Starlight). Starlight ships small inline scripts (theme switch before
# paint) and Pagefind search compiles WebAssembly, hence 'unsafe-inline' + 'wasm-unsafe-eval' for scripts.
# Acceptable here: docs is fully static, has no session and no user input. Tighten with hashes later.
# font-src data:: Vite/Astro inline @fontsource subsets under 4 KB as data: URIs (fonts cannot execute code).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.windle.fun; font-src 'self' data: https://cdn.windle.fun; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
