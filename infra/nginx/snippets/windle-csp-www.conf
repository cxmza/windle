# CSP for www.windle.fun (landing: Vite + React + R3F/three).
# 'wasm-unsafe-eval' + blob: workers: three's DRACO/KTX2/meshopt decoders compile WebAssembly in workers.
# style-src 'unsafe-inline': Motion/GSAP/R3F write style attributes at runtime; the script side stays strict.
# font-src data:: Vite/Astro inline @fontsource subsets under 4 KB as data: URIs (fonts cannot execute code).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.windle.fun; font-src 'self' data: https://cdn.windle.fun; media-src 'self' https://cdn.windle.fun; connect-src 'self' https://api.windle.fun https://cdn.windle.fun; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
