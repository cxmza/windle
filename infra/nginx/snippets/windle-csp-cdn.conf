# CSP for cdn.windle.fun. Applies to documents only (the landing page, and an SVG opened directly): with
# default-src 'none' a hostile SVG cannot run script on our origin. Images/fonts loaded cross-origin by
# other sites are not affected by this header.
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
