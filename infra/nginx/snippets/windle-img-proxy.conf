# cdn.windle.fun/img/ -> imgproxy with the nginx disk cache. Included by the /img/ location of windle-70-cdn.conf and
# again by its nested user-image location (nested locations do not inherit proxy_pass).
# imgproxy runs with IMGPROXY_PATH_PREFIX=/img, so the URI is passed unchanged.
# Cache key = negotiated format bucket + exact request URI (signature included).
limit_req zone=windle_img_rl burst=60 nodelay;

proxy_pass http://windle_imgproxy;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header Accept $windle_img_accept;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 2s;
proxy_read_timeout 30s;

proxy_cache windle_img;
proxy_cache_key "$windle_img_format|$request_uri";
proxy_cache_valid 200 30d;
proxy_cache_valid 404 1m;
proxy_cache_lock on;
proxy_cache_lock_timeout 15s;
proxy_cache_revalidate on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
# We vary on the bucket via the key; upstream's Vary: Accept would make nginx compare raw Accept
# strings and miss constantly.
proxy_ignore_headers Vary Set-Cookie;
proxy_hide_header Vary;
proxy_hide_header Set-Cookie;

include /etc/nginx/snippets/windle-cdn-headers.conf;
add_header Vary "Accept" always;
add_header X-Cache-Status $upstream_cache_status always;
# Cloudflare must not cache auto-format responses (it ignores Vary: Accept). Empty = omitted.
add_header Cloudflare-CDN-Cache-Control $windle_img_cf_cache always;
