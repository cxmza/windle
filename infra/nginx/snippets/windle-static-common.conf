# Shared behaviour of the windle static sites (www, app, oauth, docs). Included inside a server block
# that has already set `root` and `$windle_cc`'s server-level default.
#
# Cache policy goes through $windle_cc (server: add_header Cache-Control $windle_cc), so locations below
# only `set` it and keep inheriting every security header.

index index.html;
absolute_redirect off;
etag on;
client_max_body_size 16k;
# text/plain (robots.txt, llms.txt), text/xml (sitemap.xml), text/html: declare UTF-8 instead of letting clients guess.
charset utf-8;

location = /healthz {
    access_log off;
    default_type text/plain;
    set $windle_cc "no-store";
    return 200 "ok\n";
}

# Vite / Astro hashed output: the file name changes with the content, so cache forever.
location ^~ /assets/ {
    access_log off;
    set $windle_cc "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location ^~ /_astro/ {
    access_log off;
    set $windle_cc "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Icons and the web app manifest: stable names, so a day of caching (+ a week of background revalidation).
# Must stay ABOVE the generic extension regex below: regex locations match in order of appearance.
location ~ ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.png|icon-(?:192|512|maskable-512)\.png)$ {
    access_log off;
    set $windle_cc "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
}
# nginx's stock mime.types has no .webmanifest entry (it would go out as application/octet-stream).
location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    set $windle_cc "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
}
# Open Graph images (www/app): fetched by link unfurlers, regenerated rarely -> a week.
location = /og.png {
    set $windle_cc "public, max-age=604800";
    try_files $uri =404;
}
location ^~ /og/ {
    set $windle_cc "public, max-age=604800";
    try_files $uri =404;
}

# A request for a file with an asset extension that is not on disk must be a 404, never index.html:
# otherwise the browser gets HTML where it expects a script or an image and the breakage is silent.
location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|css|js|mjs|map|woff2?|ttf|otf|txt|xml|json|webmanifest|wasm)$ {
    set $windle_cc "public, max-age=3600";
    try_files $uri =404;
}
