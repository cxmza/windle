# windle TLS. One Let's Encrypt certificate (SAN) for all seven names, issued via HTTP-01 webroot
# /opt/windle/www-acme (scripts/issue-cert.sh). Renewal: the certbot.timer; the deploy hook in
# /etc/letsencrypt/renewal-hooks/deploy/ runs `nginx -t && systemctl reload nginx`.
# That is why port 80 must answer /.well-known/acme-challenge/ BEFORE any redirect (sites/windle-http.conf).

ssl_certificate         /etc/letsencrypt/live/windle.fun/fullchain.pem;
ssl_certificate_key     /etc/letsencrypt/live/windle.fun/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/windle.fun/chain.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:WindleTLS:10m;
# Tickets off: without key rotation they defeat forward secrecy.
ssl_session_tickets off;

# No ssl_stapling: Let's Encrypt dropped OCSP and no longer puts a responder URL in certificates;
# the directive would only produce warnings on every start.
