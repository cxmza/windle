# CSP for oauth.windle.fun (sign-in). SIWS via Wallet Standard: wallets are browser extensions that inject
# into the page; extension scripts are not governed by the page CSP. Nothing is framed, nothing frames us.
# form-action includes the api so future email/X/Google flows can POST/redirect through it.
# font-src data:: Vite/Astro inline @fontsource subsets under 4 KB as data: URIs (fonts cannot execute code).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.windle.fun; font-src 'self' data: https://cdn.windle.fun; connect-src 'self' https://api.windle.fun; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://api.windle.fun; object-src 'none'; upgrade-insecure-requests" always;
