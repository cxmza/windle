# windle compression for static sites. deploy-static.sh writes .br and .gz next to every text asset at
# deploy time (max level, once), *_static serves them; on-the-fly compression covers anything missed.
# brotli comes from libnginx-mod-http-brotli-{filter,static} (Debian bookworm, installed by install.sh).

gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/xml application/manifest+json application/wasm image/svg+xml font/ttf font/otf;

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 256;
brotli_types text/plain text/css text/xml text/javascript application/javascript application/json
             application/xml application/manifest+json application/wasm image/svg+xml font/ttf font/otf;
