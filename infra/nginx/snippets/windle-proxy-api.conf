# Proxy settings for api.windle.fun -> 127.0.0.1:3001 (Fastify).
proxy_pass http://windle_api;
proxy_http_version 1.1;

# websockets-ready: Upgrade passes through; plain requests send Connection "" and reuse keepalive.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $windle_connection_upgrade;

proxy_set_header Host $host;
# $remote_addr is already the real visitor (cloudflare-realip). X-Forwarded-For is OVERWRITTEN, never
# appended: whatever the client wrote into it must not reach the app. Fastify: trustProxy = loopback/bridge.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

# Timeouts: each outer timeout strictly larger than the app's own (app request timeout should be <= 30s).
# Websocket endpoints must ping more often than proxy_read_timeout.
proxy_connect_timeout 3s;
proxy_send_timeout 35s;
proxy_read_timeout 60s;

proxy_buffering on;
proxy_request_buffering on;

# nginx owns the generic security headers on this host; drop the app's copies (e.g. from @fastify/helmet)
# so responses never carry duplicates. CSP and CORS stay owned by the app.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Powered-By;
