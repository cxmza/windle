# CSP for app.windle.fun (product SPA). Session = HttpOnly cookie on .windle.fun, read by fetch to the api.
# When the app starts talking to Solana RPC directly, add those origins to connect-src (keep the list explicit).
# font-src data:: Vite/Astro inline @fontsource subsets under 4 KB as data: URIs (fonts cannot execute code).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.windle.fun; font-src 'self' data: https://cdn.windle.fun; connect-src 'self' https://api.windle.fun wss://api.windle.fun https://cdn.windle.fun; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.windle.fun https://oauth.windle.fun; object-src 'none'; upgrade-insecure-requests" always;
