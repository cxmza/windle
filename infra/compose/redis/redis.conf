# windle redis. The password is NOT here: it is passed as --requirepass from /opt/windle/shared/redis.env.
#
# Sessions live in redis, so nothing may be silently evicted: noeviction makes writes fail loudly when
# memory is full instead of logging users out at random. Use logical DBs to keep concerns apart:
#   db 0 - sessions        db 1 - rate limits        db 2 - caches / nonces (always with TTL)

bind * -::*
port 6379
protected-mode yes
tcp-keepalive 60
timeout 0
databases 16

maxmemory 192mb
maxmemory-policy noeviction

dir /data
appendonly yes
appendfsync everysec
appenddirname appendonlydir
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
# RDB snapshots as well: backup.sh copies dump.rdb after BGSAVE.
save 3600 1 300 100 60 10000
rdbcompression yes
rdbchecksum yes

loglevel notice
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
