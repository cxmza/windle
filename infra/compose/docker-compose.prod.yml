# windle production stack (data services + image transforms + api).
#
# Lives on the server at /opt/windle/compose/docker-compose.prod.yml (installed by scripts/install.sh).
# Run it only through the project name `windle`:
#   docker compose -p windle -f /opt/windle/compose/docker-compose.prod.yml up -d
#   docker compose -p windle -f /opt/windle/compose/docker-compose.prod.yml --profile api up -d api      # the api
#   docker compose -p windle -f /opt/windle/compose/docker-compose.prod.yml --profile migrate run --rm migrate
#
# Every published port is bound to 127.0.0.1: host nginx is the only public door. The box is shared with other
# production services, so the memory limits below are a hard budget: postgres 512M + redis 256M + imgproxy 384M
# + api 384M = 1536M (target <= ~1.6G). Raise one only by lowering another.
#
# Secrets come from /opt/windle/shared/*.env (chmod 600 root, generated by scripts/gen-secrets.sh, never in git).
# The owner (DDL) database credentials live only in api-migrate.env, read only by the one-off `migrate` service;
# the long-running api gets api.env with the DML-only role.

name: windle

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    env_file: /opt/windle/shared/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Tuned for a 512 MB cgroup on a 2 vCPU box that also runs other services:
    #  - shared_buffers 25% of the limit; effective_cache_size is a planner hint only (no allocation).
    #  - work_mem 4MB x max_connections 50 keeps the worst case of simultaneous sorts inside the limit.
    #  - parallelism capped at 2 workers: there are only 2 cores and the other services must keep their share.
    #  - jit off: compile cost dominates for small OLTP queries and it costs memory.
    #  - checkpoints spread (15min / 0.9) to avoid IO bursts; max_wal_size 1GB bounds WAL on disk.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=4MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - jit=off
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=0
      - -c
      - password_encryption=scram-sha-256
    shm_size: 128mb
    stop_grace_period: 60s
    mem_limit: 512m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windle -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      fun.windle.project: windle
      fun.windle.service: postgres
      fun.windle.tier: data
      fun.windle.backup: "pg_dump -Fc nightly (/opt/windle/bin/backup.sh)"

  redis:
    <<: *hardening
    image: redis:7-alpine
    env_file: /opt/windle/shared/redis.env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # The password is passed on the command line from the env file. `sh -c` re-enters the image's own
    # entrypoint so redis still drops to the `redis` user (a bare `sh -c redis-server` would run as root).
    # redis-server rewrites its process title, so the password does not show up in `ps`.
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      fun.windle.project: windle
      fun.windle.service: redis
      fun.windle.tier: data

  imgproxy:
    <<: *hardening
    image: ghcr.io/imgproxy/imgproxy:v4
    env_file: /opt/windle/shared/imgproxy.env
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_PATH_PREFIX: /img
      # Sources: only local files under /srv/windle (the static releases, read-only). It cannot fetch URLs,
      # so a leaked signing key cannot turn it into an open proxy.
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /srv/windle
      IMGPROXY_BASE_URL: "local:///current/cdn/"
      IMGPROXY_ALLOWED_SOURCES: "local://"
      # 2 vCPU shared with other services: 2 images in flight, a bounded queue, 429 beyond it.
      IMGPROXY_WORKERS: "2"
      IMGPROXY_REQUESTS_QUEUE_SIZE: "32"
      IMGPROXY_MAX_CLIENTS: "128"
      IMGPROXY_TIMEOUT: "20"
      IMGPROXY_READ_REQUEST_TIMEOUT: "10"
      IMGPROXY_DOWNLOAD_TIMEOUT: "5"
      # Decompression-bomb guards.
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_MAX_SRC_FILE_SIZE: "26214400"
      IMGPROXY_MAX_RESULT_DIMENSION: "4096"
      IMGPROXY_MAX_ANIMATION_FRAMES: "1"
      # Format negotiation by Accept when the URL has no explicit extension. nginx normalises Accept and
      # keys its cache by the negotiated format (see nginx/conf.d/windle-http.conf).
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AVIF_SPEED: "8"
      IMGPROXY_QUALITY: "80"
      IMGPROXY_FORMAT_QUALITY: "avif=62,webp=78,jpeg=82"
      IMGPROXY_JPEG_PROGRESSIVE: "true"
      IMGPROXY_STRIP_METADATA: "true"
      IMGPROXY_SANITIZE_SVG: "true"
      IMGPROXY_TTL: "31536000"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_LAST_MODIFIED: "true"
      IMGPROXY_LOG_FORMAT: json
      IMGPROXY_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:8081:8080"
    # Mounted at the same relative layout as /opt/windle so the relative symlinks current/<site> ->
    # ../releases/<ts>/<site> resolve inside the container too, and a deploy flip is seen immediately.
    volumes:
      - /opt/windle/current:/srv/windle/current:ro
      - /opt/windle/releases:/srv/windle/releases:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      fun.windle.project: windle
      fun.windle.service: imgproxy
      fun.windle.tier: edge

  # Backend (apps/api). Profile-gated: `up -d` without `--profile api` leaves it alone.
  # Build on the server from an uploaded copy of the REPO ROOT (npm workspaces: root lockfile + packages/shared):
  #   docker build -f apps/api/Dockerfile -t windle/api:<rel> -t windle/api:current --build-arg APP_COMMIT=<rel> .
  # The image carries LABEL fun.windle.project=windle, so weekly maintenance can prune old tags.
  api:
    <<: *hardening
    profiles: ["api"]
    image: windle/api:${WINDLE_API_TAG:-current}
    env_file: /opt/windle/shared/api.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      fun.windle.project: windle
      fun.windle.service: api
      fun.windle.tier: app

  # One-off schema migrations with the owner role (DDL). Never started by `up`; run before (re)starting the api:
  #   $DC --profile migrate run --rm migrate
  # Same image as the api; env comes ONLY from api-migrate.env (DATABASE_MIGRATION_URL), not from api.env.
  migrate:
    <<: *hardening
    restart: "no"
    profiles: ["migrate"]
    image: windle/api:${WINDLE_API_TAG:-current}
    env_file: /opt/windle/shared/api-migrate.env
    environment:
      NODE_ENV: production
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      disable: true
    labels:
      fun.windle.project: windle
      fun.windle.service: migrate
      fun.windle.tier: job

volumes:
  pgdata:
    labels:
      fun.windle.project: windle
  redisdata:
    labels:
      fun.windle.project: windle
